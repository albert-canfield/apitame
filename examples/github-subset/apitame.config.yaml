# apitame.config.yaml, generated by "apitame init" from openapi.yaml
# Edit it freely, then run "npx apitame inspect" to see the result.
# Reference: https://github.com/albert-canfield/apitame/blob/main/docs/configuration.md

version: 1
name: github
description: |-
  A hand-picked subset of the GitHub REST API (repositories, issues, pull requests, search, users and stars),
  used by the apitame examples. Operation ids, paths and fields follow the official GitHub description.

# Where operations come from. baseUrl overrides the first server in the spec.
source:
  type: openapi
  spec: ./openapi.yaml

# read-only (default): every write operation is blocked, whatever the allowlist says.
# read-write: operations in writes.allow can run; destructive ones also need confirmation.
mode: read-only

# Credentials come from environment variables (GITHUB_TOKEN). Never put secrets in this file.
auth:
  type: bearer
  token: ${GITHUB_TOKEN}

# maxTools counts every tool, including search_operations and call_operation.
limits:
  maxTools: 12
  maxOperationsPerTool: 15
  timeoutMs: 15000
  maxResponseBytes: 50000
  maxCallsPerMinute: 120
  maxWritesPerMinute: 20

# Task-level tools. Each one groups related operations. Rename, regroup or drop operations as you like.
# In read-only mode, write operations listed here are simply not exposed.
tools:
  - name: repos
    description: Repositories, their content, commits, branches and releases
    operations:
      - repos/get
      - repos/list-for-user
      - repos/list-for-org
      - repos/list-contributors
      - repos/list-languages
      - repos/list-branches
      - repos/list-commits
      - repos/list-releases
      - repos/get-content
      - repos/get-commit
      - repos/get-latest-release
      - repos/create-for-authenticated-user
      - repos/update
      - repos/delete
  - name: issues
    description: Issues, comments and labels
    operations:
      - issues/list-for-repo
      - issues/list-labels-for-repo
      - issues/get
      - issues/list-comments
      - issues/create
      - issues/update
      - issues/create-comment
      - issues/add-labels
      - issues/lock
      - issues/remove-label
  - name: pulls
    description: Pull requests, their files and reviews
    operations:
      - pulls/list
      - pulls/get
      - pulls/list-files
      - pulls/list-reviews
      - pulls/create
      - pulls/merge
  - name: search
    description: Search repositories, issues and code
    operations:
      - search/repos
      - search/issues-and-pull-requests
      - search/code
  - name: users
    description: User profiles
    operations:
      - users/get-authenticated
      - users/get-by-username
  - name: activity
    description: Stars and stargazers
    operations:
      - activity/list-stargazers-for-repo
      - activity/star-repo-for-authenticated-user
      - activity/unstar-repo-for-authenticated-user

# Operations that are not in a tool stay reachable through search_operations + call_operation.
longTail:
  enabled: true

# allow: operation ids that may write when mode is read-write. Wildcards work: "create*", "*".
# confirm: writes that must be confirmed by the user (destructive ones always are).
# treatAsRead: non-GET operations that only read, for example POST /search.
# destructive: writes to treat as destructive even if they do not look like it.
# Write operations in this API (13):
#   repos/update (write): PATCH /repos/{owner}/{repo}
#   repos/delete (destructive): DELETE /repos/{owner}/{repo}
#   repos/create-for-authenticated-user (write): POST /user/repos
#   issues/create (write): POST /repos/{owner}/{repo}/issues
#   issues/update (write): PATCH /repos/{owner}/{repo}/issues/{issue_number}
#   issues/create-comment (write): POST /repos/{owner}/{repo}/issues/{issue_number}/comments
#   issues/add-labels (write): POST /repos/{owner}/{repo}/issues/{issue_number}/labels
#   issues/remove-label (destructive): DELETE /repos/{owner}/{repo}/issues/{issue_number}/labels/{name}
#   issues/lock (write): PUT /repos/{owner}/{repo}/issues/{issue_number}/lock
#   pulls/create (write): POST /repos/{owner}/{repo}/pulls
#   pulls/merge (write): PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge
#   activity/star-repo-for-authenticated-user (write): PUT /user/starred/{owner}/{repo}
#   activity/unstar-repo-for-authenticated-user (destructive): DELETE /user/starred/{owner}/{repo}
writes:
  allow: []
  confirm: []
  treatAsRead: []
  destructive: []

# auto: ask the human through the MCP client (elicitation) when it supports it, else return a one-time token.
confirmation:
  method: auto
  ttlSeconds: 300

# Add "file: ./apitame-audit.jsonl" to keep a JSON Lines record of every write attempt
# (blocked, dry run, confirmed, sent) and every refused query. include: all also records reads.
audit:
  include: writes

# Generated agent skills. Regenerate with "apitame init --skills-only".
skills:
  dir: ./skills
