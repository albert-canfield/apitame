# Sample shop database for apitame.
#   docker compose up -d
#   export DATABASE_URL=postgres://apitame_ro:apitame_ro@localhost:5433/shop
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: shop_owner_local_only
    ports:
      - '5433:5432'
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop_owner -d shop']
      interval: 2s
      timeout: 3s
      retries: 20
