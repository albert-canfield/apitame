# apitame.config.yaml, generated by "apitame init" from the PostgreSQL database "shop"
# Run "npx apitame inspect" to see the tools, and "npx apitame test" to check every table.
# Reference: https://github.com/albert-canfield/apitame/blob/main/docs/configuration.md

version: 1
name: shop
description: Sample online shop with customers, products, orders and order items.

# The connection string comes from an environment variable (or .env next to this file).
# Use a read-only database role: see docs/sql.md for a two-line setup.
source:
  type: postgres
  url: ${DATABASE_URL}
  schemas:
    - public

# read-only: the query tool only runs single SELECT statements, inside a read-only transaction.
# read-write only affects named queries marked "write: true" and listed in writes.allow.
mode: read-only

# rowLimit caps every result; timeoutMs cancels slow queries.
limits:
  timeoutMs: 10000
  rowLimit: 200
  maxResponseBytes: 50000

# queries: named, parameterized queries exposed as their own tools. Example:
#   - name: orders_by_customer
#     description: Recent orders for one customer
#     sql: SELECT id, total, created_at FROM orders WHERE customer_id = :customer_id ORDER BY created_at DESC LIMIT 20
#     params:
#       customer_id: { type: integer }
# tables.allow / tables.deny: limit which tables can be listed, described and queried.
sql:
  queries:
    - name: top_customers
      description: Customers ranked by total spent on paid and shipped orders
      sql: >-
        SELECT c.id, c.name, c.country, count(o.id) AS orders, sum(o.total) AS spent
        FROM customers c JOIN orders o ON o.customer_id = c.id
        WHERE o.status IN ('paid', 'shipped')
        GROUP BY c.id, c.name, c.country
        ORDER BY spent DESC
        LIMIT :limit
      params:
        limit: { type: integer, description: How many customers to return }
    - name: orders_for_customer
      description: Recent orders of one customer, newest first
      sql: >-
        SELECT id, status, total, created_at FROM orders
        WHERE customer_id = :customer_id ORDER BY created_at DESC LIMIT 20
      params:
        customer_id: { type: integer }
    - name: cancel_order
      description: Mark one pending order as cancelled
      write: true
      sql: UPDATE orders SET status = 'cancelled' WHERE id = :order_id AND status = 'pending'
      params:
        order_id: { type: integer }
  tables:
    allow: []
    deny: []

# Named write queries allowed when mode is read-write. DELETE, UPDATE without WHERE and DDL always need confirmation.
writes:
  allow: []
  confirm: []
confirmation:
  method: auto
  ttlSeconds: 300
skills:
  dir: ./skills
