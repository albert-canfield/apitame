# Tool-selection eval tasks for examples/github-subset (read-only mode).
# The repository acme/rocket and everything in it are made up, so the agent has to
# call the API instead of answering from memory. Format: see petstore.yaml and docs/eval.md.

api: github-subset

fixtures:
  # The repository
  - operation: repos/get
    match: { owner: acme, repo: rocket }
    body:
      id: 90210
      name: rocket
      full_name: acme/rocket
      owner: { login: acme, id: 1, type: Organization }
      private: false
      html_url: https://github.com/acme/rocket
      description: A tiny launcher for big jobs
      language: Rust
      stargazers_count: 4821
      forks_count: 312
      open_issues_count: 6
      default_branch: trunk
      archived: false
  - operation: repos/list-languages
    match: { owner: acme, repo: rocket }
    body: { Rust: 750000, TypeScript: 180000, Shell: 50000, Dockerfile: 20000 }
  - operation: repos/get-content
    match: { owner: acme, repo: rocket, path: LICENSE }
    body:
      type: file
      encoding: base64
      size: 1071
      name: LICENSE
      path: LICENSE
      content: TUlUIExpY2Vuc2UK

  # Issues: 314 is closed, 377, 391 and 402 are open.
  - operation: issues/get
    match: { owner: acme, repo: rocket, issue_number: 314 }
    body:
      id: 1314
      number: 314
      title: Launch hangs when the config file is empty
      state: closed
      user: { login: ines-r, id: 7 }
      labels: [{ id: 1, name: bug, color: d73a4a }]
      comments: 6
      created_at: '2026-09-21T08:15:00Z'
      closed_at: '2026-09-30T10:12:00Z'
  - operation: issues/get
    match: { owner: acme, repo: rocket, issue_number: 377 }
    body: &issue377
      id: 1377
      number: 377
      title: Retry flaky uploads
      state: open
      user: { login: ines-r, id: 7 }
      labels: [{ id: 1, name: bug, color: d73a4a }]
      comments: 14
      created_at: '2026-09-25T13:00:00Z'
  - operation: issues/get
    match: { owner: acme, repo: rocket, issue_number: 391 }
    body: &issue391
      id: 1391
      number: 391
      title: 'Docs: explain profiles'
      state: open
      user: { login: priya-n, id: 42 }
      labels: [{ id: 2, name: docs, color: 0075ca }]
      comments: 9
      created_at: '2026-09-29T17:40:00Z'
  - operation: issues/get
    match: { owner: acme, repo: rocket, issue_number: 402 }
    body: &issue402
      id: 1402
      number: 402
      title: Add ARM64 builds
      state: open
      user: { login: dara-m, id: 9 }
      labels: []
      comments: 3
      created_at: '2026-10-06T10:05:00Z'
  - operation: issues/list-for-repo
    match: { owner: acme, repo: rocket }
    body: [*issue402, *issue391, *issue377]
  - operation: issues/list-comments
    match: { owner: acme, repo: rocket, issue_number: 377 }
    body:
      - id: 501
        user: { login: ines-r, id: 7 }
        body: I can reproduce this on 0.9.1 with large files.
        created_at: '2026-10-01T08:00:00Z'
      - id: 502
        user: { login: tomas-k, id: 15 }
        body: 'Fixed by retrying with exponential backoff in #380. Please test the nightly build.'
        created_at: '2026-10-03T16:45:00Z'

  # Pull requests: 96 is the newest, 88 is approved.
  - operation: pulls/get
    match: { owner: acme, repo: rocket, pull_number: 96 }
    body: &pr96
      id: 2096
      number: 96
      title: Speed up cold start
      state: open
      draft: false
      user: { login: dara-m, id: 9 }
      head: { ref: faster-boot }
      base: { ref: trunk }
      created_at: '2026-10-12T09:30:00Z'
  - operation: pulls/get
    match: { owner: acme, repo: rocket, pull_number: 93 }
    body: &pr93
      id: 2093
      number: 93
      title: Bump serde
      state: open
      draft: false
      user: { login: deps-bot, id: 99 }
      head: { ref: deps/serde }
      base: { ref: trunk }
      created_at: '2026-10-08T06:00:00Z'
  - operation: pulls/get
    match: { owner: acme, repo: rocket, pull_number: 88 }
    body: &pr88
      id: 2088
      number: 88
      title: Add retry policy
      state: open
      draft: false
      user: { login: tomas-k, id: 15 }
      head: { ref: retry-policy }
      base: { ref: trunk }
      created_at: '2026-10-02T14:20:00Z'
  - operation: pulls/list
    match: { owner: acme, repo: rocket }
    body: [*pr96, *pr93, *pr88]
  - operation: pulls/list-files
    match: { owner: acme, repo: rocket, pull_number: 96 }
    body:
      - { filename: src/launcher/boot.rs, status: modified, additions: 40, deletions: 12 }
      - { filename: src/cache/mod.rs, status: added, additions: 88, deletions: 0 }
      - { filename: CHANGELOG.md, status: modified, additions: 3, deletions: 0 }
  - operation: pulls/list-reviews
    match: { owner: acme, repo: rocket, pull_number: 88 }
    body:
      - id: 9001
        user: { login: ines-r, id: 7 }
        body: Looks close, one question inline.
        state: COMMENTED
        submitted_at: '2026-10-03T09:00:00Z'
      - id: 9002
        user: { login: lin-qa, id: 31 }
        body: LGTM
        state: APPROVED
        submitted_at: '2026-10-04T15:30:00Z'
  - operation: pulls/list-reviews
    match: { owner: acme, repo: rocket }
