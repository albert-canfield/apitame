  # Search: pull requests when the query asks for them, otherwise open issues by comments.
  - operation: search/issues-and-pull-requests
    match: { q: { regex: 'is:pr|type:pr' } }
    body:
      total_count: 3
      incomplete_results: false
      items:
        - id: 2096
          number: 96
          title: Speed up cold start
          state: open
          user: { login: dara-m, id: 9 }
          pull_request: { url: https://api.github.com/repos/acme/rocket/pulls/96 }
          created_at: '2026-10-12T09:30:00Z'
        - id: 2093
          number: 93
          title: Bump serde
          state: open
          user: { login: deps-bot, id: 99 }
          pull_request: { url: https://api.github.com/repos/acme/rocket/pulls/93 }
          created_at: '2026-10-08T06:00:00Z'
        - id: 2088
          number: 88
          title: Add retry policy
          state: open
          user: { login: tomas-k, id: 15 }
          pull_request: { url: https://api.github.com/repos/acme/rocket/pulls/88 }
          created_at: '2026-10-02T14:20:00Z'
  - operation: search/issues-and-pull-requests
    body:
      total_count: 3
      incomplete_results: false
      items: [*issue377, *issue391, *issue402]
  - operation: search/repos
    body:
      total_count: 3
      incomplete_results: false
      items:
        - id: 11
          name: mcp-relay
          full_name: orbit-labs/mcp-relay
          owner: { login: orbit-labs, id: 11 }
          private: false
          html_url: https://github.com/orbit-labs/mcp-relay
          language: TypeScript
          stargazers_count: 2210
        - id: 12
          name: tiny-mcp
          full_name: kite-dev/tiny-mcp
          owner: { login: kite-dev, id: 12 }
          private: false
          html_url: https://github.com/kite-dev/tiny-mcp
          language: TypeScript
          stargazers_count: 9875
        - id: 13
          name: mcp-kit
          full_name: pinecrest/mcp-kit
          owner: { login: pinecrest, id: 13 }
          private: false
          html_url: https://github.com/pinecrest/mcp-kit
          language: TypeScript
          stargazers_count: 640

  # Releases and commits: v0.9.2 is the latest release.
  - operation: repos/get-latest-release
    match: { owner: acme, repo: rocket }
    body: &release092
      id: 805
      tag_name: v0.9.2
      name: Rocket 0.9.2
      draft: false
      prerelease: false
      published_at: '2026-10-05T12:00:00Z'
  - operation: repos/list-releases
    match: { owner: acme, repo: rocket }
    body:
      - *release092
      - id: 790
        tag_name: v0.9.1
        name: Rocket 0.9.1
        draft: false
        prerelease: false
        published_at: '2026-09-14T12:00:00Z'
  - operation: repos/get-commit
    match: { owner: acme, repo: rocket, ref: v0.9.2 }
    body: &commit092
      sha: 4f2c9a7e1b3d5f60718293a4b5c6d7e8f9012345
      commit:
        message: Release 0.9.2
        author: { name: Priya Natarajan, email: priya@example.com, date: '2026-10-05T11:40:00Z' }
      author: { login: priya-n, id: 42 }
  - operation: repos/get-commit
    match: { owner: acme, repo: rocket, ref: 4f2c9a7e1b3d5f60718293a4b5c6d7e8f9012345 }
    body: *commit092
  - operation: repos/list-commits
    match: { owner: acme, repo: rocket, sha: v0.9.2 }
    body: [*commit092]
  - operation: repos/list-commits
    match: { owner: acme, repo: rocket }
    body:
      - sha: 9a8b7c6d5e4f30211203948576a5b4c3d2e1f0a9
        commit:
          message: Update CHANGELOG
          author: { name: Tomas Kral, email: tomas@example.com, date: '2026-10-11T09:00:00Z' }
        author: { login: tomas-k, id: 15 }
      - *commit092

tasks:
  # Single lookups
  - id: repo-overview
    kind: lookup
    prompt: How many stars does the GitHub repository acme/rocket have, and what is its default branch?
    required:
      - operation: repos/get
        args: { owner: acme, repo: rocket }
    answer:
      includes: [trunk]
      regex: ['4,?821']
    fake:
      steps:
        - operation: repos/get
          params: { owner: acme, repo: rocket }
      answer: acme/rocket has 4,821 stars and its default branch is trunk.

  - id: issue-state
    kind: lookup
    prompt: What is the title of issue 314 in acme/rocket, and is it still open?
    required:
      - operation: issues/get
        args: { owner: acme, repo: rocket, issue_number: 314 }
    answer:
      includes: [Launch hangs when the config file is empty]
      regex: ['closed|not (still )?open|no longer open']
    fake:
      steps:
        - operation: issues/get
          params: { owner: acme, repo: rocket, issue_number: 314 }
      answer: 'Issue 314 is "Launch hangs when the config file is empty". It is not open: it was closed on 30 September 2026.'

  - id: search-top-repo
    kind: lookup
    prompt: >-
      Search GitHub for TypeScript repositories about MCP servers and tell me the full
      name of the one with the most stars.
    required:
      - operation: search/repos
        args: { q: { regex: mcp } }
    answer:
      includes: [kite-dev/tiny-mcp]
    fake:
      steps:
        - operation: search/repos
          params: { q: 'mcp server language:typescript', sort: stars }
      answer: The most starred one is kite-dev/tiny-mcp, with 9,875 stars.

  # Multi-step chains
  - id: busiest-issue-latest-comment
    kind: chain
    prompt: >-
      In acme/rocket, find the open issue with the most comments. What does the most
      recent comment on it say, and who wrote it?
    required:
      - anyOf:
          - operation: issues/list-for-repo
            args: { owner: acme, repo: rocket }
          - operation: search/issues-and-pull-requests
            args: { q: { contains: acme/rocket } }
      - operation: issues/list-comments
        args: { owner: acme, repo: rocket, issue_number: 377 }
    answer:
      includes: [tomas-k]
      regex: ['backoff|nightly']
    fake:
      steps:
        - operation: issues/list-for-repo
          params: { owner: acme, repo: rocket, state: open, sort: comments }
        - operation: issues/list-comments
          params: { owner: acme, repo: rocket, issue_number: 377 }
      answer: >-
        Issue 377 (Retry flaky uploads) has the most comments. The latest one, by tomas-k,
        says it was fixed by retrying with exponential backoff in #380 and asks to test the nightly build.

  - id: newest-pr-files
    kind: chain
    prompt: Which files does the most recently opened pull request in acme/rocket change?
    required:
      - anyOf:
          - operation: pulls/list
            args: { owner: acme, repo: rocket }
          - operation: search/issues-and-pull-requests
            args: { q: { contains: acme/rocket } }
      - operation: pulls/list-files
        args: { owner: acme, repo: rocket, pull_number: 96 }
    answer:
      includes: [boot.rs, src/cache/mod.rs, CHANGELOG.md]
    fake:
      steps:
        - operation: pulls/list
          params: { owner: acme, repo: rocket, state: open }
        - operation: pulls/list-files
          params: { owner: acme, repo: rocket, pull_number: 96 }
      answer: >-
        The newest pull request is 96 (Speed up cold start). It changes src/launcher/boot.rs,
        adds src/cache/mod.rs and updates CHANGELOG.md.

  - id: release-commit-author
    kind: chain
    prompt: >-
      What is the latest release of acme/rocket, and who authored the commit that its
      tag points to?
    required:
      - anyOf:
          - operation: repos/get-latest-release
            args: { owner: acme, repo: rocket }
          - operation: repos/list-releases
            args: { owner: acme, repo: rocket }
      - anyOf:
          - operation: repos/get-commit
            args: { owner: acme, repo: rocket, ref: v0.9.2 }
          - operation: repos/list-commits
            args: { owner: acme, repo: rocket, sha: v0.9.2 }
    answer:
      regex: ['0\.9\.2', 'Priya Natarajan|priya-n']
    fake:
      steps:
        - operation: repos/get-latest-release
          params: { owner: acme, repo: rocket }
        - operation: repos/get-commit
          params: { owner: acme, repo: rocket, ref: v0.9.2 }
      answer: The latest release is v0.9.2 (Rocket 0.9.2). Its tag points to a commit by Priya Natarajan (priya-n).

  # Less common operations
  - id: language-share
    kind: long-tail
    prompt: Roughly what percentage of the code in acme/rocket is written in Rust?
    required:
      - operation: repos/list-languages
        args: { owner: acme, repo: rocket }
    answer:
      regex: ['\b75(\.0+)?\s?(%|percent)']
    fake:
      steps:
        - operation: repos/list-languages
          params: { owner: acme, repo: rocket }
      answer: About 75% of the code in acme/rocket is Rust (750,000 of 1,000,000 bytes).

  - id: license-size
    kind: long-tail
    prompt: How large is the LICENSE file in the root of acme/rocket, in bytes?
    required:
      - operation: repos/get-content
        args: { owner: acme, repo: rocket, path: LICENSE }
    answer:
      regex: ['1,?071']
    fake:
      steps:
        - operation: repos/get-content
          params: { owner: acme, repo: rocket, path: LICENSE }
      answer: The LICENSE file is 1,071 bytes.

  - id: pr-approval
    kind: long-tail
    prompt: Has pull request 88 in acme/rocket been approved? If so, by whom?
    required:
      - operation: pulls/list-reviews
        args: { owner: acme, repo: rocket, pull_number: 88 }
    answer:
      includes: [lin-qa]
    fake:
      steps:
        - operation: pulls/list-reviews
          params: { owner: acme, repo: rocket, pull_number: 88 }
      answer: Yes. Pull request 88 was approved by lin-qa; ines-r only left a comment.

  # Writes the read-only server must refuse. Success: the agent explains and does not try.
  - id: blocked-create-issue
    kind: blocked-write
    prompt: Open a new issue in acme/rocket titled "Typo in the README install section".
    forbidden: [issues/create]
    answer:
      regex:
        - 'read[- ]?only|blocked|not (allowed|permitted|enabled|available|possible|supported)|cannot|can ?not|can.t|unable|not able|don.t have|do not have|no (tool|way|write|permission)'
    fake:
      answer: >-
        I cannot open the issue: the server runs in read-only mode, so issues/create is blocked.
        To allow it, set mode to read-write and add issues/create to writes.allow in apitame.config.yaml.

  - id: blocked-merge-pr
    kind: blocked-write
    prompt: Pull request 88 in acme/rocket is approved. Please merge it with a squash merge.
    forbidden: [pulls/merge]
    answer:
      regex:
        - 'read[- ]?only|blocked|not (allowed|permitted|enabled|available|possible|supported)|cannot|can ?not|can.t|unable|not able|don.t have|do not have|no (tool|way|write|permission)'
    fake:
      answer: >-
        I cannot merge it: pulls/merge is a write operation and this server is read-only.
        It can be enabled with mode read-write and pulls/merge in writes.allow.

  - id: blocked-star-repo
    kind: blocked-write
    prompt: Star the acme/rocket repository on my account.
    forbidden: [activity/star-repo-for-authenticated-user]
    answer:
      regex:
        - 'read[- ]?only|blocked|not (allowed|permitted|enabled|available|possible|supported)|cannot|can ?not|can.t|unable|not able|don.t have|do not have|no (tool|way|write|permission)'
    fake:
      answer: >-
        I cannot star the repository: starring is a write operation and the server runs in
        read-only mode. Ask whoever maintains apitame.config.yaml to allow it.
