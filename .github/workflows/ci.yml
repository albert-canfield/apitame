name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  databases:
    name: Real databases (PostgreSQL 17, MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pgpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -prootpw --silent" --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      APITAME_TEST_POSTGRES_URL: postgres://postgres:pgpw@127.0.0.1:5432/postgres
      APITAME_TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration/sql.test.ts

  smoke:
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install like a user would
        run: |
          npm pack
          npm install -g ./apitame-*.tgz
      - name: First run on a clean folder
        run: |
          mkdir -p /tmp/first-run && cd /tmp/first-run
          apitame --version
          apitame init "$GITHUB_WORKSPACE/examples/petstore/openapi.yaml"
          apitame inspect --max-tokens 2000
          apitame test
          apitame add-to claude-code --write
          test -f .mcp.json && test -f .claude/skills/petstore-api/SKILL.md
          # The DuckDB driver is an optional peer dependency: never part of the default install.
          test ! -e "$(npm root -g)/@duckdb"
          # So are the OpenTelemetry packages.
          test ! -e "$(npm root -g)/@opentelemetry"
      - name: OpenTelemetry through npx -p (optional peer dependencies, pinned releases)
        run: |
          cd /tmp/first-run
          # Without the packages, serve warns with the command to run and still serves.
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 apitame serve < /dev/null 2> otel-missing.txt
          cat otel-missing.txt
          grep -q "npx -p apitame -p @opentelemetry/api@" otel-missing.txt
          grep -q "serving " otel-missing.txt
          # With them, doctor loads them (it never contacts the collector).
          TGZ="$(ls "$GITHUB_WORKSPACE"/apitame-*.tgz)"
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 npx -y -p "$TGZ" \
            -p @opentelemetry/api@1.9.1 -p @opentelemetry/sdk-trace@2.12.0 \
            -p @opentelemetry/sdk-metrics@2.12.0 -p @opentelemetry/resources@2.12.0 \
            -p @opentelemetry/exporter-trace-otlp-proto@0.223.0 \
            -p @opentelemetry/exporter-metrics-otlp-proto@0.223.0 \
            apitame doctor --offline --json > doctor.json || true
          node -e "
            const { findings } = JSON.parse(require('node:fs').readFileSync('doctor.json', 'utf8'));
            const t = findings.find((f) => f.check === 'Telemetry');
            console.log(t);
            if (t?.status !== 'ok' || !t.detail.includes('packages load')) process.exit(1);
          "
      - name: DuckDB through npx -p (optional peer dependency, pinned release)
        run: |
          mkdir -p /tmp/duckdb-run
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { DuckDBInstance } = await import('@duckdb/node-api');
            const db = await DuckDBInstance.create('/tmp/duckdb-run/shop.duckdb');
            const conn = await db.connect();
            await conn.run(readFileSync('examples/postgres-shop/seed.sql', 'utf8'));
            conn.closeSync();
            db.closeSync();
          "
          TGZ="$(ls "$GITHUB_WORKSPACE"/apitame-*.tgz)"
          cd /tmp/duckdb-run
          npx -y -p "$TGZ" -p @duckdb/node-api@1.5.6-r.1 apitame init ./shop.duckdb
          npx -y -p "$TGZ" -p @duckdb/node-api@1.5.6-r.1 apitame test
          # Without the driver, init explains how to add it and writes nothing.
          mkdir -p /tmp/duckdb-missing && cp shop.duckdb /tmp/duckdb-missing/ && cd /tmp/duckdb-missing
          if apitame init ./shop.duckdb 2> err.txt; then echo "init should fail without the driver"; exit 1; fi
          grep -q "npx -p apitame -p @duckdb/node-api" err.txt
          test ! -f apitame.config.yaml

  image:
    name: Container image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party actions are pinned by commit SHA.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: apitame:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image,ignore-error=true
      - name: Smoke test (no start without auth, read-only, non-root, /health, MCP over HTTP)
        run: scripts/docker-smoke.sh
        env:
          IMAGE: apitame:ci
