name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  databases:
    name: Real databases (PostgreSQL 17, MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pgpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -prootpw --silent" --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      APITAME_TEST_POSTGRES_URL: postgres://postgres:pgpw@127.0.0.1:5432/postgres
      APITAME_TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration/sql.test.ts

  smoke:
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install like a user would
        run: |
          npm pack
          npm install -g ./apitame-*.tgz
      - name: First run on a clean folder
        run: |
          mkdir -p /tmp/first-run && cd /tmp/first-run
          apitame --version
          apitame init "$GITHUB_WORKSPACE/examples/petstore/openapi.yaml"
          apitame inspect --max-tokens 2000
          apitame test
          apitame add-to claude-code --write
          test -f .mcp.json && test -f .claude/skills/petstore-api/SKILL.md
