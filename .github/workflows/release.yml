name: Release

# Runs when a maintainer pushes a version tag (for example v0.1.0).
# Publishes to npm with provenance and creates the GitHub release from docs/release-notes/<tag>.md.
# Both steps are skipped when already done (for example after a manual `npm publish`).
# npm auth: configure a trusted publisher on npmjs.com (package settings, GitHub Actions,
# repository albert-canfield/apitame, workflow release.yml, environment npm). No token needed.
on:
  push:
    tags: ['v*.*.*']
  # Manual run from the Actions tab: a dry run that checks npm auth and packaging, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing (GitHub signs in to npm with OIDC, no token) needs npm 11.5.1 or later.
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Dry run (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "npm user: $(npm whoami)"; else echo "No NPM_TOKEN: publishing will rely on trusted publishing."; fi
          npm pack --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "apitame@$VERSION" version >/dev/null 2>&1; then
            echo "apitame@$VERSION is already on npm, skipping publish."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ] && ! npm whoami >/dev/null 2>&1; then
            echo "::error::The NPM_TOKEN secret is invalid. Delete it (gh secret delete NPM_TOKEN) to use trusted publishing, or replace it."
            exit 1
          fi
          npm publish --provenance --access public
        env:
          # Leave the NPM_TOKEN secret unset when npm trusted publishing is configured (recommended).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
