name: Release

# Runs when a maintainer pushes a version tag (for example v0.1.0).
# Publishes to npm with provenance and creates the GitHub release from docs/release-notes/<tag>.md.
# Both steps are skipped when already done (for example after a manual `npm publish`).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check npm authentication
        run: |
          if ! user="$(npm whoami 2>/dev/null)"; then
            echo "::error::NPM_TOKEN is missing, revoked or invalid. Create a granular token with read and write access to all packages and bypass 2FA, then run: gh secret set NPM_TOKEN"
            exit 1
          fi
          echo "Publishing as $user"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "apitame@$VERSION" version >/dev/null 2>&1; then
            echo "apitame@$VERSION is already on npm, skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          # Leave unset when npm trusted publishing is configured for this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
