version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 has no compiler API for typescript-eslint and tsup declarations yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the minimum supported Node (22).
      - dependency-name: '@types/node'
        versions: ['>=23']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Base images of the container image, pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image runs Node.js 22, the oldest supported line; a new major is a decision of its own.
      - dependency-name: node
        update-types: ['version-update:semver-major']
