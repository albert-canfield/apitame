version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 has no compiler API for typescript-eslint and tsup declarations yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the minimum supported Node (22).
      - dependency-name: '@types/node'
        versions: ['>=23']
      # better-sqlite3 13 prebuilds need Node-API 10 (Node 22.14+) and crash on older Node 22.
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
