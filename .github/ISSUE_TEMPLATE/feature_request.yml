name: Feature request
description: Suggest an idea or a new source, client or safety rule
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Config or CLI examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
