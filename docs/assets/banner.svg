<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
<title id="t">apitame: tame any API or database for AI agents</title>
<desc id="d">One command turns an OpenAPI or Swagger spec, a REST API or a PostgreSQL, MySQL or SQLite database into a safe MCP server plus agent skills for Claude Code, Codex, Cursor, VS Code and Gemini CLI. Stripe's full API goes from 612 endpoints to 12 tools with 99% fewer tokens. Read-only by default, human approval for destructive writes, a dry run for every write, and secrets never reach the agent.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono,.tool,.cmd{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.word{font-size:40px;font-weight:700;letter-spacing:-0.8px}
.h1{font-size:62px;font-weight:800;letter-spacing:-2px;fill:#f8fafc}
.sub{font-size:20px;fill:#9fb0c7}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#64748b}
.stat{font-size:52px;font-weight:800;letter-spacing:-1.5px}
.arrow{fill:#64748b;font-weight:400}
.cap{font-size:15px;fill:#94a3b8}
.chip{fill:#ffffff;fill-opacity:0.05;stroke:#ffffff;stroke-opacity:0.16}
.chipt{font-size:14px;font-weight:600;fill:#e2e8f0}
.chip2{fill:#ffffff;fill-opacity:0.04;stroke:#ffffff;stroke-opacity:0.12}
.chipt2{font-size:13.5px;font-weight:500;fill:#cbd5e1}
.wire{fill:none;stroke:#2dd4bf;stroke-opacity:0.22;stroke-width:1.5}
.flow{fill:none;stroke:#5eead4;stroke-opacity:0.75;stroke-width:1.5;stroke-dasharray:3 9;stroke-linecap:round;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.cmd{font-size:14px;fill:#5eead4}
.card{fill:#0f1a2f;stroke:#ffffff;stroke-opacity:0.1}
.cardh{font-size:15px;font-weight:700;fill:#f1f5f9}
.pill{font-size:11.5px;font-weight:600;fill:#5eead4}
.pill.v{fill:#c4b5fd}
.tool{font-size:14px;fill:#e2e8f0}
.row{font-size:14px;fill:#cbd5e1}
.ico{fill:none;stroke:#5eead4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.safe{font-size:15px;font-weight:500;fill:#cbd5e1}
.foot{font-size:12.5px;fill:#94a3b8}
.ico.amber{stroke:#fbbf24}
.ico.violet{stroke:#a78bfa}
</style>
