<radialGradient id="glowT" cx="0.72" cy="0.42" r="0.45"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.16"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
