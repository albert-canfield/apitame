openapi: 3.0.3
info:
  title: Shop API
  version: '1.0'
servers:
  - url: https://api.shop.test/v1
tags:
  - name: orders
    description: Orders and refunds
  - name: reports
    description: Sales reports
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, paid, shipped] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku]
              properties:
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
    delete:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Cancelled }
  /orders/{orderId}/notes:
    get:
      operationId: listOrderNotes
      tags: [orders]
      summary: List the notes on an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /orders/{orderId}/refunds:
    post:
      operationId: createRefund
      tags: [orders]
      summary: Refund an order
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, description: Amount in cents. Leave out to refund everything. }
      responses:
        '201': { description: Refunded }
  /reports/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export a sales report
      parameters:
        - { name: month, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        status: { type: string }
